[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "airohunt-ng"
version         = "1.0.0"
description     = "802.11 monitor-mode Wi-Fi signal tracker with terminal UI"
readme          = "README.md"
license         = { text = "GPL-3.0-or-later" }
requires-python = ">=3.8"
keywords        = ["wifi", "wireless", "802.11", "monitor-mode", "security", "networking", "signal", "strength", "direction"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: Security",
    "Topic :: Utilities",
]

# No Python dependencies — only system tools (tcpdump, iw) are required.
dependencies = []

[project.scripts]
airohunt-ng = "airohunt_ng.__main__:main"

[project.urls]
Homepage   = "https://github.com/bag-man/airohunt-ng"
Repository = "https://github.com/bag-man/airohunt-ng"
"Bug Tracker" = "https://github.com/bag-man/airohunt-ng/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["airohunt_ng*"]
